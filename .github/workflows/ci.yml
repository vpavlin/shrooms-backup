name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      # The end-to-end tests run the real restic, the release the installer pins.
      - name: restic 0.19.1
        run: |
          curl -fsSL -o r.bz2 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  r.bz2" | sha256sum -c
          bunzip2 r.bz2 && chmod +x r && sudo mv r /usr/local/bin/restic
      - run: make test

  # logos-storage from the pinned upstream commit (ADR-010): upstream has no
  # release with the fixes backups need, and the installer must not fetch it
  # from a mesh. Built as upstream's own Dockerfile does, on native runners
  # for each architecture, and cached by commit so only a new pin rebuilds.
  storage:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # be9807f plus two patches by jimmy-crib/vpavlin (ADR-013): provider
      # records for 20,000 keys, not 500; a manifest asked of connected peers
      # when the DHT names none. Back to upstream once it takes them.
      STORAGE_REPO: vpavlin/nim-codex
      STORAGE_COMMIT: 0f3e5cff37c08f2dc32fb6ebdb6c1dd9921fffb8
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: logos-storage-${{ matrix.arch }}
          key: logos-storage-${{ env.STORAGE_COMMIT }}-${{ matrix.arch }}-ubuntu-24.04
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y git cmake curl make build-essential
          git init -q src && cd src
          git remote add origin https://github.com/$STORAGE_REPO
          git fetch -q --depth 1 origin $STORAGE_COMMIT && git checkout -q FETCH_HEAD
          make -j4 update
          make -j4 NIMFLAGS="-d:disableMarchNative"
          cp build/storage ../logos-storage-${{ matrix.arch }}
      - name: the pinned revision
        run: |
          ./logos-storage-${{ matrix.arch }} --version
          ./logos-storage-${{ matrix.arch }} --version | grep -q "revision: ${STORAGE_COMMIT:0:7}"
      - uses: actions/upload-artifact@v4
        with:
          name: logos-storage-${{ matrix.arch }}
          path: logos-storage-${{ matrix.arch }}

  # The image scripts/install.sh copies the daemon and logos-storage out of;
  # after the tests.
  image:
    name: publish image
    runs-on: ubuntu-latest
    needs: [test, storage]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: make image-ctx
      - uses: actions/download-artifact@v4
        with:
          pattern: logos-storage-*
          path: build
          merge-multiple: true
      - run: chmod 755 build/logos-storage-*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMG=ghcr.io/$owner/shrooms-backup
          t="$IMG:${{ github.sha }}"
          case "${{ github.ref }}" in
            refs/heads/main) t="$t,$IMG:latest" ;;
          esac
          case "${{ github.ref }}" in
            refs/tags/v*) t="$t,$IMG:${GITHUB_REF_NAME}" ;;
          esac
          echo "list=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: build
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
